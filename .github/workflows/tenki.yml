name: 天気LINE通知

on:
  schedule:
    # 30分ごとに実行し、何を送るかはスクリプト側(auto)が判断する。
    # 警報・注意報と予報の急変を早く拾うため、1時間→30分に短縮した(2026-09-07)。
    #
    # 【この間隔の意味】
    #   Publicリポジトリなので実行時間は無制限・無料。ただし GitHub の cron は
    #   書いたとおりには起動せず、実測では2〜4時間に1回しか動かない(2026-09-12検証)。
    #   そのため "*/30" は「起動の機会を多めに仕掛けておく」意味しかない。
    #   起動されにくい前提で、朝サマリーは「設定時刻を過ぎていて未送信なら送る」
    #   方式にしてあるので、多少遅れても1日1通は必ず届く。
    #
    #   警報など即時性が要るものは、この30分判定に頼らず bousai.yml 側で
    #   1回の起動から170分間ループして5分ごとに監視している。
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: test
        type: choice
        # preview は送信せずに本文をログに出すだけ。中身の確認用。
        options: [test, preview, morning, rain, warning, auto]

concurrency:
  group: tenki-weather
  cancel-in-progress: false

permissions:
  contents: write   # state.json（通知済みの記録）をコミットするため

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 通知を実行
        env:
          # 地点（Publicリポジトリでも自宅の座標が公開されないようSecretsに逃がす）
          LOCATIONS: ${{ secrets.LOCATIONS }}
          # メール（いまはこちら）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # LINE（Secretsを登録した時点で自動的に有効になる。未登録なら空でスキップされる）
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TZ: Asia/Tokyo
          STATE_FILE: state.json
        run: python3 tenki_line.py "${{ inputs.mode || 'auto' }}"

      - name: 通知済みの記録を保存
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 通知状態を更新 [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "変更なし"
          fi
